<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Sticky Notes</title>
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 30px;
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .add-btn {
            background-color: #ffde59;
            background-image: linear-gradient(315deg, #ffde59 0%, #ff914d 74%);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 145, 77, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 145, 77, 0.6);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        /* Notes Grid */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Sticky Note Card */
        .note {
            min-height: 250px;
            max-height: 350px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .note:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 25px rgba(0,0,0,0.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Note Colors */
        .note.yellow { background: #fffacd; border-top: 8px solid #f1c40f; }
        .note.pink { background: #ffe4e1; border-top: 8px solid #ff6b81; }
        .note.blue { background: #e0f7fa; border-top: 8px solid #00cec9; }
        .note.green { background: #e8f5e9; border-top: 8px solid #2ecc71; }
        .note.purple { background: #f3e5f5; border-top: 8px solid #a29bfe; }

        .note textarea {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #2c3e50;
            outline: none;
            flex-grow: 1;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 8px;
        }

        .timestamp {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #555;
            transition: color 0.2s;
        }

        .action-btn.delete:hover {
            color: #e74c3c;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sticky Notes 📝</h1>
            <button class="add-btn" id="addNoteBtn">+ Add New Note</button>
        </header>

        <div class="notes-grid" id="notesGrid">
            <!-- Notes will be injected here dynamically -->
        </div>
    </div>

    <script>
        const notesGrid = document.getElementById('notesGrid');
        const addNoteBtn = document.getElementById('addNoteBtn');

        // Color themes for random assignment
        const colors = ['yellow', 'pink', 'blue', 'green', 'purple'];

        // Load notes from localStorage on startup
        let notes = JSON.parse(localStorage.getItem('sticky_notes')) || [];

        function saveNotes() {
            localStorage.setItem('sticky_notes', JSON.stringify(notes));
        }

        function renderNotes() {
            notesGrid.innerHTML = '';

            if (notes.length === 0) {
                notesGrid.innerHTML = `<div class="empty-state">No notes found! Click "+ Add New Note" to start writing.</div>`;
                return;
            }

            notes.forEach((note, index) => {
                const noteElement = document.createElement('div');
                noteElement.classList.add('note', note.color);

                const currentDate = new Date(note.timestamp).toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                noteElement.innerHTML = `
                    <textarea placeholder="Type your note here...">${note.content}</textarea>
                    <div class="note-footer">
                        <span class="timestamp">${currentDate}</span>
                        <div class="note-actions">
                            <button class="action-btn delete" onclick="deleteNote(${index})" title="Delete Note">🗑️</button>
                        </div>
                    </div>
                `;

                // Update note content on typing (Auto-Save / Update)
                const textarea = noteElement.querySelector('textarea');
                textarea.addEventListener('input', (e) => {
                    notes[index].content = e.target.value;
                    notes[index].timestamp = new Date().toISOString(); // update timestamp
                    saveNotes();
                });

                notesGrid.appendChild(noteElement);
            });
        }

        function addNote() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const newNote = {
                content: '',
                color: randomColor,
                timestamp: new Date().toISOString()
            };

            notes.unshift(newNote); // Add to the beginning of the array
            saveNotes();
            renderNotes();

            // Focus on the newly created textarea
            const firstTextarea = notesGrid.querySelector('.note textarea');
            if (firstTextarea) firstTextarea.focus();
        }

        function deleteNote(index) {
            if (confirm('Are you sure you want to delete this note?')) {
                notes.splice(index, 1);
                saveNotes();
                renderNotes();
            }
        }

        // Event listener for Add Button
        addNoteBtn.addEventListener('click', addNote);

        // Initial Render
        renderNotes();
    </script>
</body>
</html>
